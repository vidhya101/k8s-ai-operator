# Matches the +kubebuilder:rbac markers in internal/controller/appworkload_controller.go exactly
# — least privilege: the operator can manage only the object kinds it actually reconciles, and
# nothing at the Secret/ConfigMap/RBAC level (it never touches those).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: appworkload-operator-manager-role
rules:
  - apiGroups: ["platform.io"]
    resources: ["appworkloads"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["platform.io"]
    resources: ["appworkloads/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["platform.io"]
    resources: ["appworkloads/finalizers"]
    verbs: ["update"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services", "serviceaccounts"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: appworkload-operator-leader-election-role
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
