# Hand-written to match api/v1alpha1/appworkload_types.go exactly. In a normal kubebuilder dev
# loop this file is generated by `controller-gen crd` (see the Makefile's `generate` target) —
# written by hand here since this repo doesn't invoke that code-generator toolchain in CI.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: appworkloads.platform.io
spec:
  group: platform.io
  names:
    kind: AppWorkload
    listKind: AppWorkloadList
    plural: appworkloads
    singular: appworkload
    shortNames: ["aw"]
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Image
          type: string
          jsonPath: .spec.image
        - name: Ready
          type: integer
          jsonPath: .status.readyReplicas
        - name: Cloud
          type: string
          jsonPath: .spec.cloud
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required: ["spec"]
          properties:
            spec:
              type: object
              required: ["image"]
              properties:
                image:
                  type: string
                  minLength: 1
                  description: Fully-qualified, digest-pinned image reference to run.
                port:
                  type: integer
                  format: int32
                  default: 8080
                replicas:
                  type: integer
                  format: int32
                  minimum: 1
                  default: 2
                minReplicas:
                  type: integer
                  format: int32
                maxReplicas:
                  type: integer
                  format: int32
                targetCPUUtilizationPercentage:
                  type: integer
                  format: int32
                  default: 70
                resources:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                  description: Standard corev1.ResourceRequirements (requests/limits).
                env:
                  type: array
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                    description: Standard corev1.EnvVar.
                serviceAccountAnnotations:
                  type: object
                  additionalProperties:
                    type: string
                  description: >-
                    Cloud workload-identity annotations (eks.amazonaws.com/role-arn |
                    iam.gke.io/gcp-service-account | azure.workload.identity/client-id).
                livenessPath:
                  type: string
                  default: /healthz
                readinessPath:
                  type: string
                  default: /readyz
                minAvailable:
                  type: integer
                  format: int32
                cloud:
                  type: string
                  description: Informational label only (aws|gcp|azure|local|...); the controller never branches on it.
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                readyReplicas:
                  type: integer
                  format: int32
                conditions:
                  type: array
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
