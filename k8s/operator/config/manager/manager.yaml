apiVersion: apps/v1
kind: Deployment
metadata:
  name: appworkload-operator-controller-manager
  namespace: appworkload-operator-system
  labels:
    app.kubernetes.io/name: appworkload-operator
    app.kubernetes.io/part-of: platform
spec:
  replicas: 2   # HA via leader election (main.go: --leader-elect=true) — only one replica reconciles at a time, the other is hot standby
  selector:
    matchLabels:
      app.kubernetes.io/name: appworkload-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: appworkload-operator
    spec:
      serviceAccountName: appworkload-operator
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: appworkload-operator
      containers:
        - name: manager
          image: appworkload-operator:latest   # `kustomize edit set image` in CI points this at the real built/scanned/signed image, same as the app pipeline
          args:
            - --leader-elect
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=:8443
          ports:
            - name: metrics
              containerPort: 8443
            - name: health
              containerPort: 8081
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 256Mi }
          livenessProbe:
            httpGet: { path: /healthz, port: health }
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: health }
            periodSeconds: 5
