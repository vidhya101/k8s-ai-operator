apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: default   # `kustomize edit set namespace` in CI overwrites this per-environment

resources:
  - ../../base

patches:
  # ingress-nginx is the standard choice for kind/k3s/kubeadm/bare-metal clusters with no cloud
  # load balancer. Pair with MetalLB (see .claude/skills/metallb) if you need a real external IP
  # rather than port-forward/NodePort access.
  - target:
      kind: Ingress
      name: app
    patch: |-
      - op: replace
        path: /spec/ingressClassName
        value: nginx

  - target:
      kind: NetworkPolicy
      name: app-allow-ingress-from-ingress-controller
    patch: |-
      - op: replace
        path: /spec/ingress/0/from/0/namespaceSelector/matchLabels/kubernetes.io~1metadata.name
        value: ingress-nginx

  # No cloud IAM identity locally — drop the (unset) workload-identity annotation expectation and
  # right-size requests for a laptop-class kind/k3s node instead of a cloud instance.
  - target:
      kind: Deployment
      name: app
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 50m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 64Mi

  # A single-node kind cluster can't satisfy zone/host spreading — relax the HPA floor to match
  # replicas: 1 above so a fresh local apply doesn't sit at "not enough capacity" indefinitely.
  - target:
      kind: HorizontalPodAutoscaler
      name: app
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1

  - target:
      kind: PodDisruptionBudget
      name: app
    patch: |-
      - op: replace
        path: /spec/minAvailable
        value: 0
