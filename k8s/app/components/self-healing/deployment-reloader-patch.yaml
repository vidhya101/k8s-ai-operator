# Stakater Reloader watches the ConfigMaps/Secrets a workload references and triggers a rolling
# restart when their content changes — so a config edit takes effect immediately AND rolls
# through the readiness gate + PDB instead of silently leaving old pods on stale (or new pods on
# broken) config until the next unrelated deploy.
#
# `reloader.stakater.com/auto: "true"` = watch everything this Deployment mounts/envFrom's.
# For tighter control use the targeted annotations instead:
#   configmap.reloader.stakater.com/reload: "app-config"
#   secret.reloader.stakater.com/reload: "app-secrets"
#
# No-op if Reloader isn't installed — the annotation is just metadata.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  annotations:
    reloader.stakater.com/auto: "true"
