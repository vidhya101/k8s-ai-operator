apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Scheduling controls: a PriorityClass (cluster-scoped) plus a Deployment patch that sets
# priorityClassName and shows how to add node affinity / tolerations for a dedicated node pool.
#
# No controller needed — PriorityClass and the scheduler predicates are core Kubernetes.
resources:
  - priorityclass.yaml

patches:
  - path: deployment-scheduling-patch.yaml
    target:
      kind: Deployment
      name: app
