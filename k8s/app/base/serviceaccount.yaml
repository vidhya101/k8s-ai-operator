apiVersion: v1
kind: ServiceAccount
metadata:
  name: app
  labels:
    app.kubernetes.io/name: app
    app.kubernetes.io/part-of: platform
  # Cloud-specific workload-identity annotation is added by each overlay's patch, never here:
  #   AWS   -> eks.amazonaws.com/role-arn: arn:aws:iam::<acct>:role/<role>        (IRSA)
  #   GCP   -> iam.gke.io/gcp-service-account: <name>@<project>.iam.gserviceaccount.com
  #   Azure -> azure.workload.identity/client-id: <uuid>
  #   local -> no annotation; workload has no cloud IAM identity
automountServiceAccountToken: false   # the app doesn't call the Kubernetes API — deployment.yaml sets this explicitly too, kept in sync here for anyone applying this SA standalone
