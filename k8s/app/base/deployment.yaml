apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  labels:
    app.kubernetes.io/name: app
    app.kubernetes.io/part-of: platform
spec:
  # A real value is set by kustomize replicas: in each overlay (or removed entirely once the HPA
  # takes over) — 2 here only so `kustomize build` on the bare base is still a valid, HA-by-default
  # manifest if someone applies it directly.
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0        # never drop below desired capacity during a rollout
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: app
        app.kubernetes.io/part-of: platform
      annotations: {}
        # NOTE: app-config (configmap.yaml) is a plain resource here, not a kustomize
        # `configMapGenerator`, so editing it does NOT automatically roll this Deployment — apply
        # picks up the new values on the next natural rollout only. If your config changes need to
        # take effect immediately, either (a) switch app-config to a configMapGenerator (kustomize
        # then hash-suffixes its name and auto-updates every reference, forcing a new ReplicaSet on
        # every change), or (b) run Stakater Reloader and add its
        # `reloader.stakater.com/auto: "true"` annotation here instead.
    spec:
      serviceAccountName: app
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30

      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      # Spread replicas across zones first, then nodes — survives both a single-node failure and
      # a whole-AZ outage without operator intervention. `whenUnsatisfiable: ScheduleAnyway` so a
      # single-zone dev cluster (e.g. kind) doesn't leave pods permanently Pending.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: app
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: app

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: app

      containers:
        - name: app
          image: APP_IMAGE:placeholder   # replaced by `kustomize edit set image` in CI — see deploy-k8s action
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          envFrom:
            - configMapRef:
                name: app-config

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities:
              drop: ["ALL"]

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
            # No CPU limit above the request would also be a defensible choice (avoids CPU
            # throttling under burst); this base picks a bounded limit so a single runaway pod
            # can't starve its node. Override per-workload in an overlay if profiling says otherwise.

          startupProbe:
            httpGet: { path: /healthz, port: http }
            failureThreshold: 30     # allow up to 30 * 2s = 60s for slow-starting JVMs etc.
            periodSeconds: 2

          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 0    # startupProbe already gates first readiness
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 2

          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            failureThreshold: 3
            timeoutSeconds: 2

          lifecycle:
            preStop:
              # `sleep` lifecycle action (stable since Kubernetes 1.32, no shell required) — gives
              # in-flight requests time to finish and the endpoint controller time to remove this
              # pod from Service routing before the container actually stops. Several of the
              # language templates in docker/templates run distroless/scratch images with no
              # shell, so this intentionally avoids `exec: {command: ["/bin/sh", ...]}`. On a
              # cluster older than 1.32, delete this block (or downgrade to `exec` and switch to
              # the non-distroless/-debug image variant for that language) rather than leaving a
              # preStop hook that silently fails on every pod termination.
              sleep:
                seconds: 5

          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /app/cache

      volumes:
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
