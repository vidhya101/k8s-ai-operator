apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: app
  labels:
    app.kubernetes.io/name: app
    app.kubernetes.io/part-of: platform
spec:
  # minAvailable rather than maxUnavailable: with minReplicas=2 in the HPA, this guarantees at
  # least 1 pod always stays up through a voluntary disruption (node drain, cluster upgrade).
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: app
