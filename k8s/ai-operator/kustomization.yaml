apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Everything the operator needs, minus Kyverno (install.sh applies deploy/kyverno-guardrails.yaml
# only when Kyverno is present) and minus the in-cluster Ollama when OLLAMA_EXTERNAL_URL is set.
# No image build, no configMapGenerator, no placeholders — the operator pod clones this repo at
# startup and runs from it.
#
#     kubectl apply -f crds/
#     kubectl apply -k .

namespace: ai-operator

resources:
  - deploy/namespace.yaml
  - deploy/rbac.yaml
  - deploy/ollama.yaml
  - deploy/networkpolicy.yaml
  - deploy/config.yaml
  - deploy/deployment.yaml

labels:
  - pairs:
      app.kubernetes.io/name: ai-operator
      app.kubernetes.io/part-of: platform
