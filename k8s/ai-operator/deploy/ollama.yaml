# Ollama runs INSIDE the cluster by default — no host networking, no firewall, no "bind 0.0.0.0",
# works identically on kind / minikube / kubeadm / cloud.
#
#   * kind:  install.sh mounts your host ~/.ollama/models into the node, so this pod reuses models
#            you already downloaded (no re-download).
#   * else:  models download into the PVC on first use (the operator's `pull-models` step / lazy pull).
#
# ADVANCED — point at your own (e.g. GPU) Ollama instead:
#   put  OLLAMA_EXTERNAL_URL=http://<ip>:11434  in .env. install.sh then skips this Deployment,
#   wires the operator to that URL, and verifies a cluster pod can reach it before continuing.
#
# CPU inference: the default models (config.yaml) are all <=8B so this is usable on CPU. For higher
# quality use OLLAMA_EXTERNAL_URL to a GPU host and raise the model.* values.
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: ai-operator
  labels: { app.kubernetes.io/name: ai-operator, app.kubernetes.io/component: ollama }
spec:
  selector: { app.kubernetes.io/component: ollama }
  ports:
    - { name: http, port: 11434, targetPort: 11434, protocol: TCP }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-models
  namespace: ai-operator
  labels: { app.kubernetes.io/name: ai-operator }
spec:
  accessModes: ["ReadWriteOnce"]
  resources: { requests: { storage: 40Gi } }   # room for a few 4-8B models + embeddings
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: ai-operator
  labels: { app.kubernetes.io/name: ai-operator, app.kubernetes.io/component: ollama }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/component: ollama }
  template:
    metadata:
      labels: { app.kubernetes.io/name: ai-operator, app.kubernetes.io/component: ollama }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: ollama
          image: ollama/ollama:0.5.7
          env:
            - { name: OLLAMA_HOST, value: "0.0.0.0:11434" }
            - { name: OLLAMA_KEEP_ALIVE, value: "30m" }
            - { name: OLLAMA_MODELS, value: "/models" }
            - { name: HOME, value: "/tmp" }
          ports: [{ containerPort: 11434 }]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          startupProbe:
            httpGet: { path: /api/tags, port: 11434 }
            failureThreshold: 30
            periodSeconds: 4
          livenessProbe:
            httpGet: { path: /api/tags, port: 11434 }
            periodSeconds: 20
          resources:
            requests: { cpu: "1", memory: 3Gi }
            limits:   { memory: 12Gi }        # an 8B model + kv cache; raise for bigger models
          volumeMounts:
            - { name: models, mountPath: /models }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: models
          persistentVolumeClaim: { claimName: ollama-models }
        - name: tmp
          emptyDir: {}
