# Runtime configuration. Edit live — the operator re-reads it each loop.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-operator-config
  namespace: ai-operator
  labels: { app.kubernetes.io/name: ai-operator }
data:
  # ----- master switches -----------------------------------------------------------------------
  paused: "false"                    # hard stop
  mode: "observe"                    # observe = scan + report only | assist = auto low-risk + PR rest | auto = auto all allowlisted
  # ----- what to scan ------------------------------------------------------------------------------
  scanGitEnabled: "true"
  scanClusterEnabled: "true"
  scanIntervalSeconds: "900"         # full sweep cadence; watch-driven reaction is immediate
  gitBranchBase: "main"
  gitBranchPrefix: "ai-operator/"
  watchNamespaces: ""                # empty = all (except system + those labelled ai-operator.io/policy=manual)
  excludeNamespaces: "kube-system,kube-node-lease,kube-public,ai-operator,cert-manager,kyverno"
  # ----- remediation policy ---------------------------------------------------------------------
  autoApplyRiskClasses: "low"        # in assist mode: which riskClass may be applied without a human
  allowedCharts: "ingress-nginx,kube-prometheus-stack,metrics-server,cert-manager,kyverno,vpa,keda"
  allowOpenPorts: "true"             # may the operator create Service/Ingress/Gateway/NetworkPolicy
  maxChangesPerTargetPerHour: "3"
  maxChangesClusterWidePer10Min: "8"
  requireHealthyControlPlane: "true"
  backupRetentionDays: "30"
  # ----- where the operator pod pulls its own code from (initContainers) -----------------------
  srcRepo: "https://github.com/vidhya101/k8s-ai-operator.git"
  srcRef: "main"
  # ----- models --------------------------------------------------------------------------------
  # Defaults are all <=8B so in-cluster CPU Ollama is usable. For better quality, point
  # OLLAMA_EXTERNAL_URL at a GPU Ollama (.env) and raise these to mixtral / codellama:13b.
  model.coordinator: "llama3:8b"
  model.scanner: "deepseek-coder:6.7b"
  model.security: "llama3:8b"
  model.securityFallback: "llama3:8b"
  model.remediator: "codellama:7b"
  model.gitops: "llama3:8b"
  model.embedding: "nomic-embed-text"
  ollamaTimeoutSeconds: "300"        # CPU inference is slow; be patient
  ollamaMaxConcurrent: "1"           # one model resident at a time on CPU
