# The operator's authority, expressed as RBAC. It is a WIDE builder (Helm, Istio, Kustomize,
# kubectl all work) but a NARROW destroyer: no `delete`/`deletecollection` on anything whose loss
# matters. "It cannot delete my app" is then a fact the API server enforces on every call.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-operator
  namespace: ai-operator
  labels: { app.kubernetes.io/name: ai-operator }
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ai-operator
  labels: { app.kubernetes.io/name: ai-operator }
rules:
  # ---------------------------------------------------------------------------------------------
  # READ EVERYTHING — scan live objects, read logs/events/status/metrics
  # ---------------------------------------------------------------------------------------------
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]

  # ---------------------------------------------------------------------------------------------
  # BUILD / ALTER — create + update + patch the resource types Helm / Istio / Kustomize / kubectl
  # touch. NOTE: `delete` is deliberately ABSENT from every rule below.
  # ---------------------------------------------------------------------------------------------
  - apiGroups: ["", "apps", "batch", "autoscaling", "policy", "networking.k8s.io"]
    resources:
      - configmaps          # (create/update only — see Kyverno note on Secrets below)
      - services
      - serviceaccounts
      - deployments
      - statefulsets
      - daemonsets
      - replicasets
      - jobs
      - cronjobs
      - horizontalpodautoscalers
      - poddisruptionbudgets
      - ingresses
      - networkpolicies
      - resourcequotas
      - limitranges
      - endpoints
      - endpointslices
    verbs: ["create", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale", "statefulsets/scale", "replicasets/scale"]
    verbs: ["get", "update", "patch"]

  # Pods: create + delete allowed (a Pod is controller-owned → recreated → reversible).
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods/eviction"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods/log", "pods/status"]
    verbs: ["get"]

  # Nodes: patch (cordon / label / taint) — never delete.
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch", "patch"]

  # Namespaces: create + patch (labels, PSA) — never delete.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch", "create", "patch"]

  # CRDs & operators the agents may install: create + patch — never delete.
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch", "create", "patch"]

  # Istio: create + update + patch traffic + security config. Replace-in-place or
  # backup-and-recreate-alongside; never delete.
  - apiGroups: ["networking.istio.io", "security.istio.io", "telemetry.istio.io", "install.istio.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]

  # Kyverno / Gatekeeper / cert-manager / Argo / KEDA / VPA / Prometheus-operator: install & tune.
  - apiGroups: ["kyverno.io", "constraints.gatekeeper.sh", "templates.gatekeeper.sh",
                "cert-manager.io", "argoproj.io", "keda.sh", "autoscaling.k8s.io",
                "monitoring.coreos.com"]
    resources: ["*"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]

  # Helm stores release state as Secrets of type helm.sh/release.v1 — Helm needs to write them.
  # Scoped to that type is not expressible in RBAC, so this is the ONE Secret write grant; the
  # Kyverno policy below blocks the SA from writing any non-Helm Secret.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]

  # RBAC: create + patch ONLY (grant a workload the perms it needs). The Kyverno policy blocks
  # the SA from granting itself anything or editing cluster-admin bindings.
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings", "clusterroles", "clusterrolebindings"]
    verbs: ["get", "list", "watch", "create", "patch"]

  # Its own CRDs — full control.
  - apiGroups: ["ai-operator.io"]
    resources: ["findings", "findings/status", "remediations", "remediations/status"]
    verbs: ["*"]

  # Emit Events; leader-election lease.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ai-operator
  labels: { app.kubernetes.io/name: ai-operator }
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ai-operator
subjects:
  - kind: ServiceAccount
    name: ai-operator
    namespace: ai-operator
